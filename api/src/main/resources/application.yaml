spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  security:
    jwt:
      key: ${JWT_SECRET}
      cookie:
        name: authToken
        expires-in: 900
  minio:
    endpoint: ${MINIO_INTERNAL_ENDPOINT:${MINIO_ENDPOINT}}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT}}
    access_key: ${MINIO_ROOT_USER}
    secret_key: ${MINIO_ROOT_PASSWORD}
    listing_bucket: ${MINIO_LISTING_BUCKET}
    user_bucket: ${MINIO_USER_BUCKET}
